[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-guardian"
version = "0.1.0"
description = "CLI security scanner wrapping Trivy with GitHub enrichment and Graphviz reports"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "graphviz>=0.20",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
code-guardian = "code_guardian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_guardian"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires Trivy in PATH and network access"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
